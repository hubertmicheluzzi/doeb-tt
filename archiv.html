<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOEB Archiv</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap');
  :root { --bg:#0d0f14; --bg2:#13161e; --bg3:#1a1f2b; --border:#2a3040; --text:#e2e8f0; --dim:#7a8899; --bright:#fff; --acc:#fbbf24; --mono:'IBM Plex Mono',monospace; --sans:'IBM Plex Sans',sans-serif; }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;padding:32px 24px;}
  .section-label{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
  .section-label::after{content:'';flex:1;height:1px;background:var(--border);}
  .msj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:40px;}
  .msj-card{background:var(--bg2);border:1px solid var(--border);border-top:2px solid var(--acc);border-radius:6px;padding:20px;}
  .msj-title{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--acc);margin-bottom:4px;}
  .msj-sub{font-size:11px;color:var(--dim);margin-bottom:16px;}
  .dg-btn{display:block;width:100%;font-family:var(--mono);font-size:11px;font-weight:600;padding:8px 12px;border-radius:4px;text-decoration:none;border:1px solid var(--border);background:var(--bg3);color:var(--dim);margin-bottom:8px;transition:all .15s;text-align:center;}
  .dg-btn.available{color:var(--bright);border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.07);}
  .dg-btn.available:hover{background:rgba(251,191,36,.15);}
  .dg-btn.empty{opacity:.4;cursor:default;pointer-events:none;}
  .note{font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--bg3);border:1px solid var(--border);border-radius:4px;padding:12px 16px;line-height:1.7;}
</style>
</head>
<body>
  <div class="section-label">Mannschaftssaisons (MSJ)</div>
  <div class="msj-grid">
    <div class="msj-card">
      <div class="msj-title">MSJ 2026</div>
      <div class="msj-sub">Sep 2026 – Jun 2027 · <strong style="color:var(--acc)">laufend</strong></div>
      <a class="dg-btn available" href="AR/2026/DG1/index.html">DG1 · Herbst 2026</a>
      <a class="dg-btn empty" href="#">DG2 · Frühjahr 2027</a>
    </div>
  </div>
  <div class="note">
    <strong>Legende:</strong><br>
    MSJ = Mannschaftssaison-Jahr · beginnt September des Jahres x, endet Juni des Jahres x+1<br>
    DG1 = Durchgang 1 Herbst · DG2 = Durchgang 2 Frühjahr<br>
    Ausgegraut = noch keine Daten archiviert
  </div>
</body>
</html>
