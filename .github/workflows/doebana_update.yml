# DoebAna automatisch aktualisieren
# Liest NUR die öffentlichen Dateien aus doeb-termine (termine.json, tabellen.json),
# baut damit die LIVE-Seiten, neue Archivseiten und archiv.html (tools/doeb_gen_v0.05.py)
# und pusht nur, wenn sich etwas geändert hat. In doeb-termine wird nie geschrieben.

name: DoebAna-Update

on:
  schedule:
    - cron: '23 6,18 * * *'   # täglich 06:23 und 18:23 UTC (07:23 / 19:23 Wiener Winterzeit)
  workflow_dispatch:           # Start per Hand: Actions → DoebAna-Update → Run workflow

permissions:
  contents: write

concurrency:
  group: doebana-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: doeb-tt holen
        uses: actions/checkout@v4

      - name: Daten aus doeb-termine holen (nur lesen)
        uses: actions/checkout@v4
        with:
          repository: hubertmicheluzzi/doeb-termine
          path: _quelle
          sparse-checkout: data
          persist-credentials: false

      - name: Seiten bauen
        run: python3 tools/doeb_gen_v0.05.py --data _quelle/data

      - name: Änderungen pushen (nur wenn nötig)
        run: |
          rm -rf _quelle
          if [ -z "$(git status --porcelain LIVE AR archiv.html)" ]; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name  "DoebAna-Update"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A LIVE AR archiv.html
          git commit -m "DoebAna automatisch aktualisiert ($(date -u +%Y-%m-%d))"
          git push
